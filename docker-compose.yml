services:
  postgres:
    image: postgres:16-alpine
    container_name: smartchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartchain
      POSTGRES_PASSWORD: smartchain_dev_password
      POSTGRES_DB: smartchain_db
    ports:
      - "5432:5432"
    volumes:
      - smartchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartchain -d smartchain_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartchain_pgdata:
