name: SmartChain CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-quality:
    name: CI — Typecheck, Design Guard, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck API and Web
        run: |
          npm --workspace=apps/api run typecheck
          npm --workspace=apps/web run typecheck

      - name: Verify DESIGN.md rules (no literal hex outside :root, no alert/confirm/prompt)
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,6}|alert\(|confirm\(|prompt\(' apps/web/src --include='*.ts' --include='*.tsx'; then
            echo "DESIGN.md violation detected in apps/web/src"
            exit 1
          fi
          echo "DESIGN.md compliance check passed."

      - name: Run 6-Disruption & RBAC Test Suite
        run: npm test

      - name: Build API & Web Applications
        run: npm run build

      - name: Security Audit (Critical check)
        run: npm audit --audit-level=critical

  db-integration:
    name: CI — PostgreSQL Schema & Dirty Seed Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartchain
          POSTGRES_PASSWORD: smartchain_ci_password
          POSTGRES_DB: smartchain_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartchain -d smartchain_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://smartchain:smartchain_ci_password@localhost:5432/smartchain_db?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push Prisma schema to PostgreSQL
        run: npm --workspace=apps/api exec -- prisma db push --skip-generate

      - name: Run dirty dataset seeder
        run: npm run db:seed

  cd-images:
    name: CD — Build & Push Container Images (GHCR)
    needs: [ci-quality, db-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for GHCR
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push SmartChain API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/smartchain-api:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/smartchain-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SmartChain Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/smartchain-web:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/smartchain-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd-deploy:
    name: CD — Trigger Production Deploy
    needs: [cd-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deployment webhook (if configured)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is not set; skipping webhook trigger."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"service":"smartchain","sha":"${{ github.sha }}","ref":"${{ github.ref }}"}'
